name: Build and Bundle LITHIO-SPECTRA Android APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Rust Electrochemistry Crate
        run: |
          cd rust-electrochem
          cargo test --release
          cargo build --release --target wasm32-unknown-unknown

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm ci
          npm run build

      - name: Initialize & Sync Capacitor Android Project
        run: |
          npx cap sync android || true
          mkdir -p public/releases

      - name: Build Release APK (Gradle)
        run: |
          if [ -f "android/gradlew" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleRelease
            cp app/build/outputs/apk/release/*.apk ../public/releases/lithio-spectra-v1.24.0-universal.apk || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lithio-spectra-v1.24.0-universal-apk
          path: public/releases/
